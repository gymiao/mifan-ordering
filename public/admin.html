<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>荷包蛋餐厅 · 管理后台</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-orders.css"><link rel="stylesheet" href="/admin-share.css"><link rel="stylesheet" href="/mobile-overlays.css"><script src="/admin.js" defer></script>
</head>
<body>
  <header class="admin-header"><a href="/" class="brand"><span>蛋</span>荷包蛋餐厅</a><div><a class="customer-link" href="/">顾客点餐页 ↗</a><span class="status-dot"></span>菜单管理后台</div></header>
  <main class="admin-main">
    <section class="admin-title"><div><p class="eyebrow">MENU CONTROL</p><h1>菜单管理</h1><p>维护顾客端展示的菜品、价格和售卖状态。</p></div><button class="primary" id="new-item">＋ 新增菜品</button></section>
    <section class="toolbar"><label class="search">⌕ <input id="filter" placeholder="搜索菜品名称"></label><select id="category-filter"><option value="all">全部分类</option></select><span id="item-count"></span></section>
    <section class="table-wrap"><table><thead><tr><th>菜品</th><th>分类</th><th>价格</th><th>销量</th><th>状态</th><th></th></tr></thead><tbody id="item-list"><tr><td colspan="6" class="loading">正在加载菜单…</td></tr></tbody></table></section>
    <section class="orders-section"><div class="orders-heading"><div><p class="eyebrow">ORDER INBOX</p><h2>订单中心</h2></div><div class="order-tools"><select id="order-status"><option value="all">全部订单</option><option value="ordered">已下单</option><option value="cooking">正在做</option><option value="completed">已完成</option></select><span id="order-count"></span></div></div><div class="table-wrap"><table><thead><tr><th>订单</th><th>菜品</th><th>顾客信息</th><th>金额</th><th>下单时间</th><th>状态</th></tr></thead><tbody id="order-list"><tr><td colspan="6" class="loading">登录后加载订单…</td></tr></tbody></table></div></section>
    <section class="orders-section"><div class="orders-heading"><div><p class="eyebrow">USER MANAGEMENT</p><h2>用户管理</h2></div></div><form class="user-form" id="user-form"><input name="username" required minlength="3" maxlength="32" placeholder="用户名"><input name="password" required type="password" minlength="4" maxlength="128" placeholder="初始密码"><select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select><button class="primary">新增用户</button></form><div class="table-wrap"><table><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th></th></tr></thead><tbody id="user-list"><tr><td colspan="5" class="loading">登录后加载用户…</td></tr></tbody></table></div></section>
  </main>
  <div class="modal" id="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><div><p class="eyebrow">DISH EDITOR</p><h2 id="modal-title">新增菜品</h2></div><button class="icon-close" id="cancel">×</button></div><form id="item-form">
    <div class="form-grid"><label>菜品名称<input name="name" required maxlength="40"></label><label>价格（元）<input name="price" required type="number" min="0.01" step="0.01"></label><label>分类<select name="category" id="item-category" required></select></label><label>Emoji 图标<input name="emoji" maxlength="4" placeholder="🍱"></label><label class="wide">菜品描述<input name="description" required maxlength="120"></label><label>标签（逗号分隔）<input name="tags" placeholder="招牌,热销"></label><label>背景色<input name="color" type="color" value="#7da66a"></label><label class="wide">餐品图片<input name="image" type="file" accept="image/jpeg,image/png,image/webp"><input name="imageUrl" type="hidden"><small class="image-tip" id="image-tip">支持 JPG、PNG、WebP，最大 8MB</small></label></div>
    <label class="availability"><input name="available" type="checkbox" checked> 在售</label><p class="form-error" id="form-error"></p><div class="form-actions"><button type="button" class="secondary" id="cancel-bottom">取消</button><button type="submit" class="primary" id="save">保存菜品</button></div>
  </form></div></div>
  <div class="modal" id="dish-share-modal" aria-hidden="true"><div class="modal-card share-card"><div class="modal-head"><div><p class="eyebrow">DISH SHARE</p><h2 id="dish-share-title">分享菜品</h2></div><button class="icon-close" id="close-share">×</button></div><p>将此链接发送给顾客，打开后会自动定位到这道菜。</p><input id="dish-share-link" readonly><div class="form-actions"><button class="secondary" type="button" id="native-share">系统分享</button><button class="primary" type="button" id="copy-dish-link">复制链接</button></div></div></div>
  <div class="token-modal" id="token-modal"><form id="token-form"><h2>管理员登录</h2><p>使用管理员账号进入订单、菜单与用户管理。</p><input id="username" required autocomplete="username" placeholder="用户名"><input id="password" type="password" required autocomplete="current-password" placeholder="密码"><p class="form-error" id="token-error"></p><button class="primary">进入管理后台</button></form></div>
  <div class="toast" id="toast"></div>
</body>
</html>
