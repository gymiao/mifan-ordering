<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="description" content="荷包蛋餐厅在线点餐">
  <title>荷包蛋餐厅 · 在线点餐</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/share.css">
  <link rel="stylesheet" href="/mobile-overlays.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="荷包蛋餐厅首页">
      <span class="brand-mark">米</span>
      <span>荷包蛋餐厅</span>
    </a>
    <button class="location" type="button" aria-label="选择门店">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.1 7-12A7 7 0 1 0 5 9c0 6.9 7 12 7 12Zm0-9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
      <span>新天地店</span><span class="chevron">⌄</span>
    </button>
    <button class="icon-btn" type="button" aria-label="个人中心">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0"/></svg>
    </button>
    <a class="admin-link" href="/admin.html">商家后台 ↗</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">TODAY'S FRESH</p>
        <h1>今天，<br>也要好好吃饭。</h1>
        <p class="hero-sub">精选当季食材，每一份都现点现做。</p>
        <button class="hero-cta" type="button" data-scroll-menu>开始点餐 <span>→</span></button>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="sun"></div>
        <div class="leaf leaf-one">⌁</div>
        <div class="leaf leaf-two">⌁</div>
        <div class="bowl"><div class="rice">🍚</div></div>
        <span class="steam steam-a">S</span><span class="steam steam-b">S</span>
      </div>
    </section>

    <section class="service-bar" aria-label="服务说明">
      <div><span class="service-icon">⚡</span><p><strong>现点现做</strong><small>预计 25–35 分钟</small></p></div>
      <div><span class="service-icon">▣</span><p><strong>安心食材</strong><small>每日新鲜采购</small></p></div>
      <div><span class="service-icon">♨</span><p><strong>保温配送</strong><small>到手依然热乎</small></p></div>
    </section>

    <section class="menu-section" id="menu">
      <div class="section-heading">
        <div><p class="eyebrow">OUR MENU</p><h2>今天想吃点什么？</h2></div>
        <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="搜索菜品" autocomplete="off"></label>
      </div>
      <nav class="categories" id="categories" aria-label="菜品分类"></nav>
      <div class="menu-grid" id="menu-grid" aria-live="polite">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>
  </main>

  <aside class="cart-panel" id="cart-panel" aria-hidden="true">
    <button class="cart-backdrop" data-close-cart aria-label="关闭购物车"></button>
    <div class="cart-sheet" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <div class="sheet-handle"></div>
      <div class="cart-head"><div><p class="eyebrow">YOUR ORDER</p><h2 id="cart-title">我的餐篮</h2></div><button class="close-btn" data-close-cart aria-label="关闭">×</button></div>
      <div class="fulfillment" id="fulfillment"><button class="active" data-type="delivery">外卖配送</button><button data-type="pickup">到店自取</button></div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-empty" id="cart-empty"><span>🍚</span><p>餐篮还是空的</p><small>去挑几样喜欢的吧</small></div>
      <div class="checkout-fields" id="checkout-fields">
        <input id="note" maxlength="120" placeholder="备注（选填）">
      </div>
      <div class="summary" id="summary"></div>
      <button class="checkout-btn" id="checkout" disabled><span>确认下单</span><strong id="checkout-total">¥0</strong></button>
    </div>
  </aside>

  <button class="floating-cart" id="floating-cart" type="button" aria-label="打开购物车">
    <span class="bag-icon">▱</span><span>查看餐篮</span><strong id="floating-total">¥0</strong><i id="cart-count">0</i>
  </button>

  <div class="toast" id="toast" role="status"></div>
  <div class="success-modal" id="success-modal" aria-hidden="true">
    <div class="success-card"><span class="success-icon">✓</span><h2>下单成功</h2><p id="success-copy"></p><div class="share-order"><small>分享给商家处理订单</small><input id="order-share-link" readonly><button id="copy-order-link" type="button">复制处理链接</button></div><button id="success-close">继续逛逛</button></div>
  </div>
</body>
</html>
